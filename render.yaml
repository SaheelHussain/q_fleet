services:
  - type: web
    name: q-fleet-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: FRONTEND_ORIGINS
        value: https://q-fleet-dxxcyhj0g-saheelhussain.vercel.app
